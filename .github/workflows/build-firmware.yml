name: CI

on: [push, pull_request]

jobs:
  build-firmware:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/pine64/openpinebuds:latest-sdk
    steps:
      - name: Build the main firmware
        run: cd /usr/src/ && ./build.sh || cat /usr/src/log.txt

      - name: Archive produced firmware
        uses: actions/upload-artifact@v4
        with:
          path: /usr/src/out/open_source/open_source.bin

  # Parity job for the CMake migration (see PLAN.md): builds the same
  # open_source target through CMakePresets.json instead of make, and
  # archives the equivalent output. Additive only -- the make-based job
  # above remains the source of truth until this has proven itself out.
  # The dev_env image ships an apt-vintage cmake too old to read
  # CMakePresets.json (bullseye's is 3.18, the preset file needs >=3.19)
  # and has no ninja at all, so both are fetched as pinned binaries here
  # rather than changing the Dockerfile everyone else also uses.
  build-firmware-cmake:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/pine64/openpinebuds:latest-sdk
    steps:
      - name: Install cmake and ninja
        # dev_env's apt package list drifts out from under bullseye-security
        # as older point releases get purged from the mirror (bullseye is
        # EOL), so avoid apt for this rather than pin a version that will
        # eventually 404 the same way; python3 (already in the image) can
        # unzip without needing the `unzip` package at all.
        run: |
          curl -fsSL https://github.com/Kitware/CMake/releases/download/v3.28.3/cmake-3.28.3-linux-x86_64.tar.gz \
            | tar -xz -C /usr/local --strip-components=1
          curl -fsSL -o /tmp/ninja.zip https://github.com/ninja-build/ninja/releases/download/v1.11.1/ninja-linux.zip
          python3 -m zipfile -e /tmp/ninja.zip /usr/local/bin/
          chmod +x /usr/local/bin/ninja

      - name: Configure and build via CMake
        run: |
          cd /usr/src
          cmake --preset open_source -DOPB_ENABLE_RUST=OFF
          cmake --build --preset open_source

      - name: Archive produced firmware
        uses: actions/upload-artifact@v4
        with:
          name: open_source-cmake.bin
          path: /usr/src/build/open_source/firmware/open_source.bin
